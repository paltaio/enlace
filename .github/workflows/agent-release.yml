name: agent release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

  build:
    name: agent (${{ matrix.name }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: enlace-agent
            artifact: enlace-agent-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: enlace-agent
            artifact: enlace-agent-linux-arm64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: enlace-agent
            artifact: enlace-agent-macos-x86_64
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bin: enlace-agent
            artifact: enlace-agent-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: enlace-agent.exe
            artifact: enlace-agent-windows-x86_64.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: enlace-agent.exe
            artifact: enlace-agent-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build agent
        run: cargo build -p enlace-agent --release --locked --all-features --target ${{ matrix.target }}

      - name: Install UPX on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Compress agent on Linux
        if: runner.os == 'Linux'
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Smoke test compressed agent
        if: runner.os == 'Linux'
        run: |
          set +e
          target/${{ matrix.target }}/release/${{ matrix.bin }} 2>agent.err
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            cat agent.err
            exit 1
          fi
          grep -q "seed is required" agent.err

      - name: Package agent on Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.artifact }}

      - name: Package agent on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"

      - name: Upload agent
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  relay:
    name: relay (linux-x86_64)
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Build relay
        run: cargo build -p enlace-relay --release --locked --all-features

      - name: Package relay
        run: |
          mkdir -p dist
          cp target/release/enlace-relay dist/enlace-relay-linux-x86_64
          cp target/release/enlace-relay dist/enlace-relay-linux-x86_64-upx
          upx --best --lzma dist/enlace-relay-linux-x86_64-upx

      - name: Upload relay
        uses: actions/upload-artifact@v4
        with:
          name: enlace-relay-linux-x86_64
          path: dist/enlace-relay-linux-x86_64*
          if-no-files-found: error

  release:
    name: publish release
    needs:
      - build
      - relay
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
