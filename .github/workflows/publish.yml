name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Build relay bundle
        run: |
          cargo build -p enlace-relay --release --locked --all-features
          mkdir -p dist
          cp target/release/enlace-relay dist/enlace-relay-linux-x86_64
          cp target/release/enlace-relay dist/enlace-relay-linux-x86_64-upx
          upx --best --lzma dist/enlace-relay-linux-x86_64-upx

      - name: Upload relay bundle
        uses: actions/upload-artifact@v4
        with:
          name: enlace-relay-linux-x86_64
          path: dist/enlace-relay-linux-x86_64*
          if-no-files-found: error

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p enlace
          cargo publish -p enlace-relay
