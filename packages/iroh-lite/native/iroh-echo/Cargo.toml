[package]
name = "iroh-lite-native-echo"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.102"
bytes = "=1.11.1"
iroh = { version = "=0.98.2", default-features = false, features = ["tls-ring", "test-utils"] }
iroh-gossip = { version = "=0.98.0", default-features = false }
n0-future = "=0.3.2"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
rand = "=0.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
