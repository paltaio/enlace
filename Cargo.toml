[workspace]
resolver = "3"
members = [
    "crates/enlace",
    "crates/enlace-relay",
    "crates/enlace-testkit",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = { version = "=1.0.102" }
async-trait = { version = "=0.1.89" }
axum = { version = "=0.8.9" }
axum-server = { version = "=0.8.0", default-features = false, features = [
    "tls-rustls",
] }
base64 = { version = "=0.22.1", default-features = false, features = [
    "alloc",
] }
tokio = { version = "=1.52.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "time",
] }
futures-core = { version = "=0.3.32", default-features = false }
clap = { version = "=4.6.1", default-features = false, features = [
    "derive",
    "std",
] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = [
    "std",
    "getrandom",
] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
    "fast",
    "std",
    "zeroize",
] }
hkdf = { version = "=0.12.4", default-features = false }
lru = { version = "=0.18.0", default-features = false }
mainline = { version = "=6.1.2" }
pkarr = { version = "=6.0.0-rc.0" }
rand = { version = "=0.10.1" }
proptest = { version = "=1.11.0" }
rmp-serde = { version = "=1.3.1" }
reqwest = { version = "=0.13.3", default-features = false, features = [
    "rustls",
] }
serde = { version = "=1.0.228", default-features = false, features = [
    "derive",
] }
sha2 = { version = "=0.10.9", default-features = false }
sled = { version = "=0.34.7" }
subtle = { version = "=2.6.1", default-features = false }
tokio-stream = { version = "=0.1.18", default-features = false, features = [
    "sync",
] }
tower = { version = "=0.5.3" }
tracing = { version = "=0.1.44", default-features = false }
url = { version = "=2.5.8", default-features = false }
zeroize = { version = "=1.8.2" }
