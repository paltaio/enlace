[package]
name = "enlace"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted mailbox and latest-value slot fan-out."
readme = "README.md"

[features]
default = ["http", "pkarr", "iroh", "sled"]
all-transports = ["http", "dht", "pkarr", "iroh"]
fuzzing = ["http"]
http = ["dep:reqwest"]
dht = ["dep:mainline"]
pkarr = ["dep:pkarr"]
iroh = ["dep:iroh", "dep:iroh-gossip"]
sled = ["dep:sled"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-core = { workspace = true }
hkdf = { workspace = true }
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
lru = { workspace = true }
mainline = { workspace = true, optional = true }
pkarr = { workspace = true, optional = true }
rmp-serde = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
sled = { workspace = true, optional = true }
subtle = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
