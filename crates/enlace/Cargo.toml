[package]
name = "enlace"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted mailbox and latest-value slot fan-out."
readme = "README.md"

[features]
default = ["http", "pkarr", "iroh", "sled"]
all-transports = ["http", "dht", "pkarr", "iroh"]
fuzzing = ["http"]
http = ["dep:reqwest"]
dht = ["dep:mainline"]
pkarr = ["dep:pkarr"]
iroh = ["dep:iroh", "dep:iroh-gossip"]
sled = ["dep:sled"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
hkdf = { workspace = true }
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
lru = { workspace = true }
mainline = { workspace = true, optional = true }
pkarr = { workspace = true, optional = true }
rmp-serde = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
sled = { workspace = true, optional = true }
subtle = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The workspace tokio enables the multi-thread runtime, which doesn't compile
# for wasm32. Use a current-thread-only Tokio there with just the sync/io
# primitives this crate consumes; timers come from gloo-timers via the
# `runtime` module.
tokio = { version = "=1.52.1", default-features = false, features = [
    "sync",
    "macros",
    "io-util",
    "rt",
] }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }
gloo-timers = { workspace = true }
# `getrandom` is pulled transitively (rand_core ← crypto-common ← chacha20poly1305)
# and refuses to compile for wasm32-unknown-unknown without the `js` shim. We
# don't use `getrandom` directly; the dependency is here purely so cargo's
# feature unifier turns the shim on for the transitive consumers.
getrandom = { version = "=0.2.17", features = ["js"] }

[dev-dependencies]
proptest = { workspace = true }
