[package]
name = "enlace-agent"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Local daemon for enlace clients."

[[bin]]
name = "enlace-agent"
path = "src/main.rs"

[features]
default = ["http", "dht", "pkarr"]
http = ["enlace/http"]
dht = ["enlace/dht"]
pkarr = ["enlace/pkarr"]
iroh = ["enlace/iroh"]
unix-socket = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
enlace = { path = "../enlace", default-features = false }
hkdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
enlace-testkit = { path = "../enlace-testkit" }
tower = { workspace = true, features = ["util"] }
